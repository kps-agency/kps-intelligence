# Production de l'API sur un VPS (le web est sur Vercel) :
#   api    NestJS, processus permanent
#   redis  files BullMQ (non exposé)
#   caddy  reverse proxy HTTPS (certificat Let's Encrypt automatique)
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Voir docs/DEPLOYMENT.md.
services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env.production
    environment:
      APP_ENV: production
      API_PORT: "4000"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN manquant dans .env.production}
    volumes:
      - ./infrastructure/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis-data:
  caddy-data:
  caddy-config:
